name: Trigger auto deployment for cap-test-consumption

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ testnov3 ]
    paths:
    - '**'
    - '.github/workflows/cap-test-consumption-AutoDeployTrigger-07aeca76-16eb-4b22-8e10-5b7c8f411b0f.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CAPTESTCONSUMPTION_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CAPTESTCONSUMPTION_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CAPTESTCONSUMPTION_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: registrymounika3009.azurecr.io
          registryUsername: ${{ secrets.CAPTESTCONSUMPTION_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CAPTESTCONSUMPTION_REGISTRY_PASSWORD }}
          containerAppName: cap-test-consumption
          resourceGroup: cap-ogf-test-mounika
          imageToBuild: registrymounika3009.azurecr.io/cap-test-consumption:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


